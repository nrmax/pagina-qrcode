<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1526"/>
      <stop offset="1" stop-color="#111d38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#0a5cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0a5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.045" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- electrical cabinet -->
  <g stroke="#e8eefc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="300" y="150" width="600" height="480" rx="24"/>

    <!-- breakers: two columns -->
    <g stroke="#6f9bff">
      <rect x="350" y="210" width="96" height="46" rx="9"/>
      <rect x="350" y="286" width="96" height="46" rx="9"/>
      <rect x="350" y="362" width="96" height="46" rx="9"/>
      <rect x="350" y="438" width="96" height="46" rx="9"/>
      <rect x="486" y="210" width="96" height="46" rx="9"/>
      <rect x="486" y="286" width="96" height="46" rx="9"/>
      <rect x="486" y="362" width="96" height="46" rx="9"/>
      <rect x="486" y="438" width="96" height="46" rx="9"/>
    </g>

    <!-- breaker toggles -->
    <g stroke="#e8eefc" stroke-opacity="0.85">
      <path d="M386 220 v26 M386 296 v26 M386 372 v26 M386 448 v26"/>
      <path d="M522 220 v26 M522 296 v26 M522 372 v26 M522 448 v26"/>
    </g>

    <!-- terminal row -->
    <rect x="350" y="530" width="232" height="60" rx="12" stroke-opacity="0.7"/>
    <path d="M382 530 V590 M414 530 V590 M446 530 V590 M478 530 V590 M510 530 V590 M542 530 V590" stroke-opacity="0.4"/>

    <!-- status leds -->
    <circle cx="640" cy="200" r="12" stroke="#3ddc84"/>
    <circle cx="684" cy="200" r="12" stroke="#ffb020"/>
    <circle cx="728" cy="200" r="12" stroke="#ff5f57"/>

    <!-- wiring -->
    <g stroke="#6f9bff" stroke-opacity="0.75">
      <path d="M640 236 Q720 300 760 400 T820 560"/>
      <path d="M684 236 Q760 320 790 440 T840 570"/>
      <path d="M728 236 Q800 340 830 470 T860 580"/>
    </g>

    <!-- handle -->
    <rect x="852" y="330" width="18" height="120" rx="9" stroke="#6f9bff"/>
  </g>

  <text x="48" y="748" fill="#ffffff" fill-opacity="0.55" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" letter-spacing="1.5">NRmax · imagem de demonstração</text>
</svg>
